<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>エージェント開発ダッシュボード</title>
<style>
  /* 構成は「案A（情報密度）」、見た目は「案B（管制室）」。
     - ファーストビューだけで 12 プロジェクトの稼働状況が読めること
     - 判定と並び順は集約側が決める（画面側で数え直さない）
     - 状態色は状態専用。プロジェクトの識別は固定パレット＋短縮コード */
  :root {
    --scale: 1;
    /* 着色の強さ。白地は淡い塗りだと沈むので、ライト側で強める */
    --tint: 14%; --tintline: 40%; --cardshadow: none;
    --bg: #060910; --grid: #0b1220; --panel: #0f1725; --panel2: #131d2e; --edge: #1e2b40;
    --fg: #e9f0fa; --muted: #94a7c0; --faint: #6b809b;
    --red: #ff5c62; --amber: #ffb236; --blue: #46b1ff; --green: #2fd899; --violet: #b98bff; --slate: #7d8ea6;
    --p1: #46b1ff; --p2: #ffa94d; --p3: #2fd899; --p4: #b98bff;
    --p5: #ff79b0; --p6: #ffd93d; --p7: #4fd6d6; --p8: #a3e635;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme]) {
      --tint: 20%; --tintline: 55%; --cardshadow: 0 1px 2px rgba(16,24,40,.06), 0 6px 16px rgba(16,24,40,.06);
      --bg: #e7ebf3; --grid: #dde4ef; --panel: #ffffff; --panel2: #f4f7fc; --edge: #ccd6e6;
      --fg: #0b1120; --muted: #4a5872; --faint: #6c7c95;
      --red: #cf1f26; --amber: #a05a00; --blue: #0b64c8; --green: #067a55; --violet: #5b34bd; --slate: #4a5872;
      --p1: #0b64c8; --p2: #b45309; --p3: #067a55; --p4: #6d28d9;
      --p5: #be185d; --p6: #92700a; --p7: #0e7490; --p8: #4d7c0f;
    }
  }
  :root[data-theme="light"] {
    --tint: 20%; --tintline: 55%; --cardshadow: 0 1px 2px rgba(16,24,40,.06), 0 6px 16px rgba(16,24,40,.06);
    --bg: #e7ebf3; --grid: #dde4ef; --panel: #ffffff; --panel2: #f4f7fc; --edge: #ccd6e6;
    --fg: #0b1120; --muted: #4a5872; --faint: #6c7c95;
    --red: #cf1f26; --amber: #a05a00; --blue: #0b64c8; --green: #067a55; --violet: #5b34bd; --slate: #4a5872;
    --p1: #0b64c8; --p2: #b45309; --p3: #067a55; --p4: #6d28d9;
    --p5: #be185d; --p6: #92700a; --p7: #0e7490; --p8: #4d7c0f;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; max-width: 100%; overflow-x: hidden; }
  /* flex/grid の子は既定で min-width:auto。中身の最小幅がそのまま画面幅を押し広げるので、
     横スクロールが出る箇所は明示的に 0 にする */
  #stats, .tools, .logo, .stat { min-width: 0; }
  body {
    margin: 0; color: var(--fg); background: var(--bg);
    background-image: linear-gradient(var(--grid) 1px, transparent 1px),
                      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 48px 48px, 48px 48px;
    font: calc(14px * var(--scale))/1.45 "Segoe UI Variable Text", "Segoe UI", "Yu Gothic UI", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .num, code { font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; font-variant-numeric: tabular-nums; }
  .micro { font-size: calc(10px * var(--scale)); letter-spacing: .18em; color: var(--faint); text-transform: uppercase; }
  .spacer { flex: 1 1 auto; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; } }

  /* ---------- ヘッダー（帯状の指標） ---------- */
  header { position: sticky; top: 0; z-index: 30; display: flex; align-items: stretch; gap: 0;
           background: linear-gradient(180deg, var(--panel), var(--panel2));
           border-bottom: 1px solid var(--edge); }
  .logo { display: flex; flex-direction: column; justify-content: center; gap: 2px;
          padding: calc(9px * var(--scale)) calc(18px * var(--scale)); border-right: 1px solid var(--edge); }
  .logo b { font-size: calc(17px * var(--scale)); font-weight: 800; letter-spacing: .1em; }
  .logo .sub { font-size: calc(10px * var(--scale)); letter-spacing: .16em; color: var(--faint); text-transform: uppercase; }
  .stat { display: flex; flex-direction: column; justify-content: center; gap: 2px; min-width: calc(104px * var(--scale));
          padding: calc(8px * var(--scale)) calc(16px * var(--scale)); border-right: 1px solid var(--edge); }
  .stat b { font-size: calc(26px * var(--scale)); font-weight: 800; line-height: 1; color: var(--c, var(--fg));
            text-shadow: 0 0 20px color-mix(in srgb, var(--c, transparent) 45%, transparent); }
  .stat.alarm { background: linear-gradient(180deg, color-mix(in srgb, var(--red) var(--tint), transparent), transparent);
               box-shadow: inset 3px 0 0 var(--red); }
  .stat .sub { font-size: calc(10.5px * var(--scale)); color: var(--muted); }
  .stat .row { display: flex; gap: 8px; align-items: baseline; }
  .stat .chip { font-size: calc(10px * var(--scale)); font-weight: 700; padding: 1px 6px; border-radius: 4px;
                color: var(--cc); background: color-mix(in srgb, var(--cc) var(--tint), transparent);
                border: 1px solid color-mix(in srgb, var(--cc) var(--tintline), transparent); }
  .tools { display: flex; align-items: center; gap: calc(10px * var(--scale));
           padding: 0 calc(16px * var(--scale)); color: var(--muted); font-size: calc(11.5px * var(--scale)); }
  .tools label { display: inline-flex; align-items: center; gap: 5px; cursor: pointer; white-space: nowrap; }
  select { background: var(--panel2); color: var(--fg); border: 1px solid var(--edge); border-radius: 6px;
           padding: 2px 5px; font: inherit; font-size: calc(11.5px * var(--scale)); }
  .feed { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
  .feed.ok { color: var(--green); } .feed.late { color: var(--amber); }
  .feed.dead { color: var(--red); } .feed.snap { color: var(--muted); }
  .clock { font-size: calc(19px * var(--scale)); font-weight: 700; letter-spacing: .04em; }

  /* ---------- 本体レイアウト（左: 盤面 / 右: 対応キュー） ---------- */
  main { display: grid; grid-template-columns: minmax(0, 1fr) calc(400px * var(--scale));
         gap: calc(14px * var(--scale)); padding: calc(14px * var(--scale)); align-items: start; }
  /* grid の子は既定で min-width:auto。長い文字列が列幅を押し広げて画面外へ溢れるのを止める */
  main > section, main > .side, .panel, .card { min-width: 0; }
  .qtitle, .qwhy, .urow .lb, .unitline .label { overflow-wrap: anywhere; }
  @media (max-width: 1380px) { main { grid-template-columns: minmax(0, 1fr); } }
  h2 { display: flex; align-items: center; gap: 10px; margin: 0 0 calc(9px * var(--scale));
       font-size: calc(10.5px * var(--scale)); font-weight: 800; letter-spacing: .2em;
       color: var(--faint); text-transform: uppercase; }
  h2::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, var(--edge), transparent); }
  h2 .count { color: var(--muted); letter-spacing: .1em; }

  /* ---------- 全プロジェクトの一列サマリ（ファーストビューで全体を掴む） ---------- */
  .fleetstrip { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px;
                padding: calc(8px * var(--scale)) calc(10px * var(--scale));
                border: 1px solid var(--edge); border-radius: 10px; background: var(--panel); }
  .fchip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px 3px 6px; border-radius: 8px;
           font-size: calc(11.5px * var(--scale)); font-weight: 700; white-space: nowrap;
           background: color-mix(in srgb, var(--c) var(--tint), transparent);
           border: 1px solid color-mix(in srgb, var(--c) var(--tintline), transparent); color: var(--c); }
  .fchip .pn { color: var(--pc); }
  .fchip .n { font-family: ui-monospace, Consolas, monospace; font-variant-numeric: tabular-nums; }

  /* ---------- プロジェクト盤面 ---------- */
  .matrix { display: grid; grid-template-columns: repeat(auto-fill, minmax(calc(310px * var(--scale)), 1fr));
            gap: calc(10px * var(--scale)); }
  .card { position: relative; border: 1px solid var(--edge); border-radius: 10px; background: var(--panel);
          box-shadow: var(--cardshadow);
          padding: calc(11px * var(--scale)) calc(13px * var(--scale)); overflow: hidden; }
  .card::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 3px; background: var(--pc); }
  .card.hot { border-color: color-mix(in srgb, var(--red) 60%, var(--edge));
              box-shadow: inset 0 0 40px -22px var(--red); }
  .card.warmup { border-color: color-mix(in srgb, var(--amber) 45%, var(--edge)); }
  .card.idle { opacity: .72; }
  .chead { display: flex; align-items: center; gap: 8px; }
  .chead .name { font-size: calc(15px * var(--scale)); font-weight: 800; letter-spacing: .01em; }
  .chead .flag { margin-left: auto; font-size: calc(11px * var(--scale)); font-weight: 800; padding: 2px 8px;
                 border-radius: 5px; white-space: nowrap; color: var(--c);
                 background: color-mix(in srgb, var(--c) var(--tint), transparent);
                 border: 1px solid color-mix(in srgb, var(--c) var(--tintline), transparent); }
  .cmeta { display: flex; gap: 8px; align-items: center; margin-top: 2px; }
  .cbody { display: flex; align-items: flex-end; gap: 10px; margin: calc(6px * var(--scale)) 0; }
  .big { display: flex; align-items: baseline; gap: 5px; }
  .big b { font-size: calc(27px * var(--scale)); font-weight: 800; line-height: 1; color: var(--c, var(--fg)); }
  .big span { font-size: calc(9.5px * var(--scale)); letter-spacing: .14em; color: var(--faint); text-transform: uppercase; }
  .spark { flex: 1; height: calc(34px * var(--scale)); min-width: 60px; }
  .unitline { display: flex; align-items: center; gap: 7px; margin-top: calc(6px * var(--scale)); }
  .unitline .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--c); flex: none; }
  .unitline .label { font-size: calc(13px * var(--scale)); font-weight: 650; overflow: hidden;
                     text-overflow: ellipsis; white-space: nowrap; }
  .unitline .state { margin-left: auto; font-size: calc(11.5px * var(--scale)); font-weight: 700; color: var(--c); white-space: nowrap; }
  .unitsub { display: flex; gap: 8px; margin-left: 14px; color: var(--faint);
             font-size: calc(11px * var(--scale)); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .evidence { display: flex; align-items: center; gap: 8px; margin-top: calc(8px * var(--scale));
              padding: calc(5px * var(--scale)) calc(9px * var(--scale)); border-radius: 6px;
              font-size: calc(11.5px * var(--scale)); font-weight: 700;
              background: color-mix(in srgb, var(--c) var(--tint), transparent); color: var(--c);
              border: 1px solid color-mix(in srgb, var(--c) var(--tintline), transparent); }
  .evidence .ev { margin-left: auto; color: var(--faint); font-weight: 600; }

  /* ---------- 右カラム: 対応キュー / 稼働ユニット ---------- */
  .side { display: flex; flex-direction: column; gap: calc(14px * var(--scale)); position: sticky; top: calc(74px * var(--scale)); }
  @media (max-width: 1380px) { .side { position: static; } }
  .panel { border: 1px solid var(--edge); border-radius: 10px; background: var(--panel);
           box-shadow: var(--cardshadow); overflow: hidden; }
  .panel .ph { display: flex; align-items: baseline; gap: 10px; padding: calc(10px * var(--scale)) calc(13px * var(--scale));
               border-bottom: 1px solid var(--edge); }
  .panel .ph b { font-size: calc(11px * var(--scale)); font-weight: 800; letter-spacing: .16em; text-transform: uppercase; }
  .panel .ph .n { margin-left: auto; font-size: calc(22px * var(--scale)); font-weight: 800; color: var(--c, var(--fg)); }
  .qrow { display: block; padding: calc(9px * var(--scale)) calc(13px * var(--scale));
          border-bottom: 1px solid var(--edge); border-left: 3px solid var(--c);
          background: linear-gradient(90deg, color-mix(in srgb, var(--c) 10%, transparent), transparent 60%); }
  .qrow:last-child { border-bottom: 0; }
  .qtop { display: flex; align-items: center; gap: 8px; font-size: calc(10.5px * var(--scale));
          letter-spacing: .12em; text-transform: uppercase; color: var(--c); font-weight: 800; }
  .qtitle { margin-top: 3px; font-size: calc(13.5px * var(--scale)); font-weight: 700; }
  .qwhy { color: var(--muted); font-size: calc(12px * var(--scale)); margin-top: 2px;
          display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .urow { display: flex; align-items: center; gap: 8px; padding: calc(6px * var(--scale)) calc(13px * var(--scale));
          border-bottom: 1px solid color-mix(in srgb, var(--edge) 60%, transparent); font-size: calc(12.5px * var(--scale)); }
  .urow:last-child { border-bottom: 0; }
  .urow .pn { font-weight: 700; color: var(--pc); white-space: nowrap; }
  .urow .lb { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .urow .tm { margin-left: auto; color: var(--faint); white-space: nowrap; }

  /* ---------- 下段のステータスバー ---------- */
  footer { display: flex; align-items: center; gap: calc(18px * var(--scale)); flex-wrap: wrap;
           margin: 0 calc(14px * var(--scale)) calc(14px * var(--scale));
           padding: calc(9px * var(--scale)) calc(14px * var(--scale));
           border: 1px solid var(--edge); border-radius: 10px; background: var(--panel);
           font-size: calc(11.5px * var(--scale)); color: var(--muted); }
  footer .k { color: var(--faint); letter-spacing: .14em; text-transform: uppercase; font-size: calc(10px * var(--scale)); }
  footer .v { color: var(--fg); font-weight: 650; }
  .badge-conf { color: var(--red); border: 1px solid color-mix(in srgb, var(--red) 45%, transparent);
                background: color-mix(in srgb, var(--red) 14%, transparent); border-radius: 6px;
                padding: 2px 9px; font-weight: 750; }

  .dot { width: calc(8px * var(--scale)); height: calc(8px * var(--scale)); border-radius: 50%; background: var(--c); flex: none; }
  .dot.pulse { animation: pulse 1.7s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .25; } }
  .sigil { display: inline-flex; align-items: center; justify-content: center; flex: none;
           padding: 1px 6px; border-radius: 5px; font-size: calc(10px * var(--scale)); font-weight: 800;
           letter-spacing: .06em; color: var(--pc); background: color-mix(in srgb, var(--pc) var(--tint), transparent);
           border: 1px solid color-mix(in srgb, var(--pc) var(--tintline), transparent); }
  details { margin-top: calc(7px * var(--scale)); }
  details > summary { cursor: pointer; color: var(--faint); font-size: calc(11px * var(--scale)); list-style: none; }
  details > summary::-webkit-details-marker { display: none; }
  details > summary::before { content: "› "; }
  details[open] > summary::before { content: "⌄ "; }
  table { border-collapse: collapse; width: 100%; font-size: calc(12px * var(--scale)); margin-top: 5px; }
  th, td { text-align: left; padding: 2px 8px 2px 0; vertical-align: top; }
  th { color: var(--faint); font-weight: 700; }
  .ev-list { margin-top: 6px; }
  .ev-line { border-left: 2px solid var(--edge); padding-left: 8px; margin-bottom: 2px; font-size: calc(12px * var(--scale)); }
  .ev-line.red { border-left-color: var(--red); } .ev-line.green { border-left-color: var(--green); }
  .pill { border: 1px solid var(--edge); border-radius: 5px; padding: 0 6px;
          font-size: calc(11px * var(--scale)); color: var(--muted); }
  .empty { color: var(--muted); padding: calc(12px * var(--scale)) calc(14px * var(--scale)); }
  a { color: var(--blue); }

  /* ---------- 状態色 ---------- */
  .st-waiting-approval, .st-crashed, .st-failed, .st-aborted, .cat-human, .cat-incident { --c: var(--red); }
  .st-blocked, .st-stalled, .cat-watch { --c: var(--amber); }
  .st-review { --c: var(--violet); }
  .st-running { --c: var(--blue); }
  .st-done { --c: var(--green); }
  .st-idle { --c: var(--slate); }

  /* ---------- スマホ（片手で「手が要るか」を判断できることだけに絞る） ---------- */
  @media (max-width: 820px) {
    body { background-size: 32px 32px, 32px 32px; }
    header { flex-wrap: wrap; }
    .logo { flex: 1 1 100%; border-right: 0; border-bottom: 1px solid var(--edge);
            flex-direction: row; align-items: baseline; gap: 10px; padding: 8px 12px; }
    .logo b { font-size: 15px; }
    #stats { flex-wrap: wrap; overflow: visible !important; }
    .stat { flex: 1 1 30%; min-width: 0; padding: 7px 10px; border-bottom: 1px solid var(--edge); }
    .stat:nth-child(3) { flex: 1 1 100%; order: -1; }        /* NEEDS HUMAN を最上段に */
    .stat:nth-child(3) .row { flex-wrap: wrap; }
    .stat:nth-child(n+4) { display: none; }                   /* 資源・デバイス・推移は下段へ回す */
    .stat b { font-size: 24px; }
    .tools { flex: 1 1 100%; border-top: 1px solid var(--edge); padding: 6px 12px; flex-wrap: wrap; gap: 8px; }
    .clock { font-size: 16px; }
    main { grid-template-columns: 1fr; padding: 10px; gap: 12px; }
    .matrix { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
    .card { padding: 9px 10px; }
    .card .unitsub, .card details, .card .evidence .ev, .cmeta { display: none; }
    .card .unitline .state { font-size: 10.5px; }
    .big b { font-size: 21px; }
    .spark { height: 22px; }
    .qtitle, .qwhy { white-space: normal; word-break: break-word; }
    .qwhy { -webkit-line-clamp: 3; }
    .urow .lb { display: none; }
    footer { margin: 0 10px 12px; gap: 10px; }
    .side { order: -1; }
    .fleetstrip { order: -2; }        /* 全体像 → 対応キュー → 盤面 の順に読ませる */
    .fchip { font-size: 11px; padding: 2px 7px 2px 5px; }
  }
  /* 常時表示: 文字を大きくしたまま 12 件が入るよう、1 タイルの中身を削る
     （2 本目以降の作業行・補足・エビデンス帯を畳み、要注意は数字と色で示す） */
  body.tv { --scale: 1.35; }
  body.tv details, body.tv .tools label, body.tv .cmeta,
  body.tv .unitline.rest, body.tv .unitsub, body.tv .evidence { display: none; }
  body.tv .matrix { grid-template-columns: repeat(auto-fill, minmax(calc(250px * var(--scale)), 1fr)); }
  body.tv .card { padding: calc(9px * var(--scale)) calc(11px * var(--scale)); }
  body.tv .unitline { margin-top: calc(4px * var(--scale)); }
  body.tv .qwhy { -webkit-line-clamp: 1; }
  /* --- 2 段目: プロジェクト詳細 / 単位詳細 --------------------------------
     フリートは「どれに手を貸すか」を選ぶ画面。選んだ後に「何が起きたのか」を
     見る場所が無いと、結局 .agent-status の生ファイルを読む羽目になる。
     自己完結 HTML の制約は崩さない（別ページではなく同一ファイル内のビュー切替） */
  /* main は display:grid を持つため、hidden 属性だけでは消えない（実測で両方描画された） */
  [hidden] { display: none !important; }
  .crumbs { display: flex; gap: calc(8px * var(--scale)); align-items: center; flex-wrap: wrap;
            font-size: calc(12px * var(--scale)); color: var(--muted); margin-bottom: calc(10px * var(--scale)); }
  .crumbs a { color: var(--blue); text-decoration: none; }
  .crumbs a:hover { text-decoration: underline; }
  .dhead { display: flex; align-items: baseline; gap: calc(10px * var(--scale)); flex-wrap: wrap;
           margin-bottom: calc(10px * var(--scale)); }
  .dhead h2 { margin: 0; }
  .dhead .path { font-size: calc(11px * var(--scale)); color: var(--faint); word-break: break-all; }
  /* 見出しのスパークラインは飾り。フリートのカード内と違って伸ばさない（全幅に広がって主役になる） */
  .dhead .spark { flex: 0 0 auto; width: calc(120px * var(--scale)); }
  /* 詳細では 1 行に収める必要が無い。切り捨てると理由の後半が読めない */
  .dpanel .unitsub { white-space: normal; overflow: visible; text-overflow: clip;
                     overflow-wrap: anywhere; margin-left: 0; }
  .dgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
           gap: calc(12px * var(--scale)); }
  .dpanel { background: var(--panel); border: 1px solid var(--edge); border-radius: 10px;
            padding: calc(11px * var(--scale)); box-shadow: var(--cardshadow); }
  .dpanel h3 { margin: 0 0 calc(8px * var(--scale)); font-size: calc(11px * var(--scale));
               letter-spacing: .14em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
  .lanes { display: grid; grid-template-columns: 1fr 1fr; gap: calc(12px * var(--scale)); }
  .lane .ln { display: grid; grid-template-columns: auto 1fr; gap: calc(8px * var(--scale));
              padding: calc(4px * var(--scale)) 0; border-top: 1px dashed var(--edge);
              font-size: calc(12px * var(--scale)); }
  .lane .ln:first-of-type { border-top: none; }
  .lane .ln.red { color: var(--red); }
  .lane .ln .t { color: var(--faint); font-variant-numeric: tabular-nums; }
  .tasklist { display: flex; flex-direction: column; gap: calc(4px * var(--scale)); }
  .tasklist .tk { display: flex; gap: calc(8px * var(--scale)); font-size: calc(12px * var(--scale)); }
  .tasklist .tk.done { color: var(--green); }
  .tasklist .tk.dropped { color: var(--faint); text-decoration: line-through; }
  .kv { display: grid; grid-template-columns: auto 1fr; gap: calc(4px * var(--scale)) calc(10px * var(--scale));
        font-size: calc(12px * var(--scale)); }
  .kv .k { color: var(--muted); }
  .cmd { font-family: ui-monospace, Consolas, monospace; font-size: calc(11px * var(--scale));
         background: var(--panel2); border: 1px solid var(--edge); border-radius: 6px;
         padding: calc(6px * var(--scale)); word-break: break-all; color: var(--fg); }
  a.cardlink, a.rowlink { color: inherit; text-decoration: none; display: block; }
  a.cardlink:focus-visible, a.rowlink:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
  .unitline.clickable:hover .label { text-decoration: underline; }
  @media (max-width: 820px) { .lanes { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <div class="logo"><b>UNITY AGENT CONTROL</b><span class="sub" id="host"></span></div>
  <div class="stats" id="stats" style="display:flex;flex:1 1 auto;overflow-x:auto"></div>
  <div class="tools">
    <span class="clock num" id="clock"></span>
    <select id="theme" title="テーマ">
      <option value="dark">ダーク</option><option value="light">ライト</option><option value="auto">OS に合わせる</option>
    </select>
    <label><input type="checkbox" id="showDone"> 完了</label>
    <label><input type="checkbox" id="tvMode"> 常時表示</label>
    <span class="feed" id="feed"></span>
  </div>
</header>
<main id="fleetView">
  <div class="fleetstrip" id="fleetStrip"></div>
  <section>
    <h2>Project Matrix <span class="count" id="matrixCount"></span></h2>
    <div class="matrix" id="matrix"></div>
  </section>
  <aside class="side">
    <div class="panel" id="queuePanel"></div>
    <div class="panel" id="unitsPanel"></div>
  </aside>
</main>
<main id="detailView" class="detail" hidden style="display:block"></main>
<footer id="footer"></footer>
<script>
const FLEET = /*__FLEET_DATA__*/null;
const STATE = {
  "waiting-approval": {label: "承認待ち", glyph: "⏳"}, "blocked": {label: "ブロック", glyph: "⛔"},
  "crashed": {label: "プロセス消失", glyph: "💀"}, "failed": {label: "失敗", glyph: "✖"},
  "aborted": {label: "中断", glyph: "⊘"}, "stalled": {label: "停滞", glyph: "⏸"},
  "review": {label: "レビュー待ち", glyph: "👁"}, "running": {label: "実行中", glyph: "▶"},
  "done": {label: "完了", glyph: "✔"}, "idle": {label: "待機", glyph: "·"}
};
const KIND = {
  conflict: "編集衝突", orphanResource: "取り残し資源",
  deviceOverload: "デバイス過負荷", dataWarning: "記録の警告"
};
const CAT_LABEL = {human: "承認・判断待ち", incident: "障害", watch: "様子見"};
const PALETTE = ["--p1","--p2","--p3","--p4","--p5","--p6","--p7","--p8"];

function el(tag, attrs, ...kids) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === null || v === undefined || v === false) continue;
    if (k === "class") node.className = v; else node.setAttribute(k, v);
  }
  for (const kid of kids.flat()) {
    if (kid === null || kid === undefined || kid === false) continue;
    node.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  }
  return node;
}
function svg(tag, attrs) {
  const node = document.createElementNS("http://www.w3.org/2000/svg", tag);
  for (const [k, v] of Object.entries(attrs || {})) node.setAttribute(k, v);
  return node;
}
function secondsSince(iso) {
  if (!iso) return Infinity;
  const diff = (Date.now() - new Date(iso).getTime()) / 1000;
  return isFinite(diff) ? diff : Infinity;
}
function ago(iso) {
  if (!iso) return "";
  const diff = secondsSince(iso);
  if (!isFinite(diff)) return "";
  if (diff < 60) return Math.max(0, Math.round(diff)) + "秒";
  if (diff < 3600) return Math.round(diff / 60) + "分";
  if (diff < 86400) return Math.round(diff / 3600) + "時間";
  return Math.round(diff / 86400) + "日";
}
function agoNode(iso, cls) {
  return el("span", {class: cls || "", "data-at": iso || "", title: iso || ""}, ago(iso));
}
function hhmm(iso) {
  if (!iso) return "--:--";
  const d = new Date(iso);
  return isFinite(d.getTime()) ? String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0") : "--:--";
}
function paletteVar(project) {
  let hash = 0;
  for (const ch of String(project.projectId || project.name || "")) hash = (hash * 33 + ch.codePointAt(0)) % 997;
  return PALETTE[hash % PALETTE.length];
}
function sigilText(name) {
  const clean = String(name || "?").replace(/^unity[-_]?/i, "") || String(name || "?");
  const parts = clean.split(/[-_.\s\/]+/).filter(Boolean);
  return (parts.length >= 2 ? parts[0][0] + parts[1][0] : clean.slice(0, 2)).toUpperCase();
}
// 同名プロジェクトが並ぶと集約側が displayName を「親フォルダ名/自身」へ切り替える。
// sigil も同じ文字列から作らないと、衝突した全プロジェクトの短縮コードが同じ 2 文字に潰れる
function sigilOf(project) { return sigilText(project.displayName || project.name); }
function stateOf(unit) { return (unit.derived || {}).state || unit.state || "running"; }
/* スパークライン: 直近 60 分のイベント数。数字より「動いているか」が早く読める */
function sparkline(buckets, color) {
  const box = svg("svg", {class: "spark", viewBox: "0 0 120 34", preserveAspectRatio: "none"});
  const values = (buckets && buckets.length ? buckets : [0]);
  const max = Math.max(1, ...values);
  const step = values.length > 1 ? 120 / (values.length - 1) : 120;
  const points = values.map((v, i) => `${(i * step).toFixed(1)},${(32 - (v / max) * 28).toFixed(1)}`).join(" ");
  const area = svg("polygon", {points: `0,34 ${points} 120,34`, fill: `color-mix(in srgb, ${color} 18%, transparent)`});
  const line = svg("polyline", {points, fill: "none", stroke: color, "stroke-width": "2.1",
                                "stroke-linejoin": "round", "stroke-linecap": "round"});
  box.append(area, line);
  return box;
}
function evidenceOk(ev) { return ev ? ev.ok : null; }
function eventText(ev) {
  const d = ev.data || {};
  const kind = ev.kind.split(".")[1];
  if (ev.kind === "claim.task") return `タスク ${d.taskId} → ${d.status}`;
  if (ev.kind === "claim.blocked") return `ブロック（${d.needs}）: ${d.reason || ""}`;
  if (ev.kind === "claim.heartbeat") return `${d.state}${d.activity ? " / " + d.activity : ""}`;
  if (ev.kind === "claim.begin") return `開始: ${d.label || ""}`;
  if (ev.kind === "claim.end") return `終了: ${d.result} ${d.summary || ""}`;
  if (ev.kind === "claim.resource") return `資源 ${d.action}: ${d.resource}`;
  if (ev.kind === "evidence.test" || ev.kind === "evidence.e2e") {
    const total = (d.passed || 0) + (d.failed || 0);
    return `${d.suite || kind} ${d.passed || 0}/${total}${d.failed ? " 失敗" + d.failed : ""}${d.error ? " " + d.error : ""}`;
  }
  if (ev.kind === "evidence.build") return `ビルド ${d.target || ""} exit=${d.exitCode}`;
  if (ev.kind === "evidence.git") return `${d.action || "commit"} ${(d.sha || "").slice(0, 8)} ${d.subject || ""}`;
  if (ev.kind === "evidence.resource") return `資源 ${d.action}: ${d.resource}`;
  if (ev.kind === "evidence.device") return `${d.serial} load=${d.load1}`;
  return ev.kind;
}
function link(path) {
  // 値は書き手が入れた任意文字列。javascript: 等の実行可能スキームはリンクにしない
  // （集約側でも落としているが、ここでも allowlist で二重に止める）
  if (typeof path !== "string" || !path.trim()) return null;
  // 制御文字（タブ・改行等）は URL 解析時に除去され java&#9;script: が javascript: になる
  if (/[\u0000-\u001f\u007f]/.test(path)) return document.createTextNode(path);
  if (path.trim().split("/")[0].includes(":") && !/^([a-zA-Z]:[\\/]|https?:|file:)/i.test(path.trim())) {
    return document.createTextNode(path);
  }
  const text = path.trim();
  // UNC（\\host\share）はリンクにしない: クリックで Windows が SMB 接続を試み、
  // 環境によっては資格情報のネゴシエーションまで進む（値を書くのは外部ツール）
  if (text.startsWith("\\\\")) return document.createTextNode(text);
  if (/^[a-zA-Z]:[\\/]/.test(text) || text.startsWith("/")) {
    return el("a", {href: "file:///" + text.replace(/\\/g, "/")}, text);
  }
  const scheme = text.match(/^([a-zA-Z][a-zA-Z0-9+.-]*):/);
  if (!scheme) return el("a", {href: text}, text);
  if (/^file$/i.test(scheme[1])) {
    // file:///… （ホスト無し）だけ許す。file://host/share は外部共有を引きにいく
    return /^file:\/\/\//i.test(text) ? el("a", {href: text}, text) : document.createTextNode(text);
  }
  if (/^https?$/i.test(scheme[1])) return el("a", {href: text}, text);
  return document.createTextNode(text);
}

/* ---------- ヘッダーの指標帯 ---------- */
function statBlock(value, label, sub, color, alarm) {
  return el("div", {class: "stat" + (alarm ? " alarm" : ""), style: color ? `--c: var(--${color})` : null},
    el("div", {class: "micro"}, label),
    el("div", {class: "row"}, el("b", {class: "num"}, String(value)), sub ? el("span", {class: "sub"}, sub) : null));
}
function drawStats(fleet) {
  const box = document.getElementById("stats");
  box.textContent = "";
  const s = fleet.summary || {};
  const human = s.human || 0, incident = s.incident || 0, watch = s.watch || 0;
  const needs = human + incident + watch;

  const needsBlock = el("div", {class: "stat" + (needs ? " alarm" : ""), style: "--c: var(--red)"},
    el("div", {class: "micro"}, "Needs Human"),
    el("div", {class: "row"},
      el("b", {class: "num"}, String(needs).padStart(2, "0")),
      el("span", {class: "chip", style: "--cc: var(--red)"}, `承認・判断 ${human}`),
      el("span", {class: "chip", style: "--cc: var(--red)"}, `障害 ${incident}`),
      el("span", {class: "chip", style: "--cc: var(--amber)"}, `様子見 ${watch}`)));

  const trend = el("div", {class: "stat", style: "min-width:160px"},
    el("div", {class: "micro"}, "Last 60 min · " + (s.events60m || 0) + " events"),
    sparkline(s.activityBuckets, "var(--blue)"));

  box.append(
    statBlock(`${s.activeProjects || 0}/${s.projects || 0}`, "Projects Online", null, needs ? null : "green"),
    statBlock(s.running || 0, "Running Units", null, "blue"),
    needsBlock,
    statBlock(s.resourcesHeld || 0, "Resources Held", null, (s.resourcesHeld || 0) ? "amber" : null),
    statBlock(`${s.devicesReady || 0}/${s.devices || 0}`, "Devices Ready", null, null),
    trend);
}

/* ---------- プロジェクト盤面（案A の 1 タイル） ---------- */
function projectCard(project, index, showDone) {
  const running = project.runningCount || 0;
  const attn = project.attentionCount || 0;
  const worst = (project.priorityItems || [])[0];
  const tone = worst ? (worst.category === "watch" ? "warmup" : "hot") : (running ? "" : "idle");
  const flagColor = worst ? (worst.category === "watch" ? "amber" : "red") : (running ? "blue" : "slate");
  const card = el("article", {class: "card " + tone, style: `--pc: var(${paletteVar(project)})`,
                              "data-project": project.projectId || ""});
  // 見出しから 2 段目（プロジェクト詳細）へ。カード全体をリンクにすると
  // 中の details（開閉）やリンクが押せなくなるので、見出しだけをリンクにする
  card.append(el("a", {class: "cardlink", href: projectHref(project),
                       title: "プロジェクト詳細を開く"},
    el("div", {class: "chead"},
      el("span", {class: "sigil"}, sigilOf(project)),
      el("span", {class: "name"}, project.displayName || project.name),
      el("span", {class: "flag", style: `--c: var(--${flagColor})`},
        attn ? `!${attn}` : running ? "OK" : "IDLE"))));
  card.append(el("div", {class: "cmeta"},
    el("span", {class: "micro"}, `P${String(index + 1).padStart(2, "0")}`),
    el("span", {class: "micro"}, hhmm(project.lastActivityAt) + (running ? " ACTIVE" : " QUIET"))));

  card.append(el("div", {class: "cbody"},
    el("div", {class: "big", style: "--c: var(--blue)"}, el("b", {class: "num"}, String(running)), el("span", {}, "Running")),
    el("div", {class: "big", style: `--c: var(--${attn ? (worst && worst.category === "watch" ? "amber" : "red") : "slate"})`},
      el("b", {class: "num"}, String(attn)), el("span", {}, "Attn")),
    sparkline(project.activityBuckets, running ? "var(--blue)" : attn ? "var(--amber)" : "var(--slate)")));

  const units = (project.units || []).filter(u => {
    const state = stateOf(u);
    return showDone || (state !== "done" && state !== "idle");
  }).slice(0, 2);
  units.forEach((unit, index) => {
    const state = stateOf(unit);
    const prog = unit.progress || {};
    // 2 本目以降は常時表示モードで畳む（遠くから見るときは先頭 1 本で足りる）
    card.append(el("a", {class: "rowlink", href: unitHref(project, unit), title: "この作業の詳細を開く"},
      el("div", {class: "unitline clickable st-" + state + (index ? " rest" : "")},
        el("span", {class: "dot" + (state === "running" ? " pulse" : "")}),
        el("span", {class: "label"}, unit.label || unit.unitId),
        el("span", {class: "state"}, (STATE[state] || {}).label || state)),
      el("div", {class: "unitsub"},
        el("span", {}, unit.activity || ((unit.derived || {}).reasons || [])[0] || ""),
        el("span", {}, "·"), agoNode(unit.lastHeartbeat),
        prog.total ? el("span", {}, `· ${prog.done}/${prog.total - prog.dropped}`) : null)));
  });
  if (!units.length) card.append(el("div", {class: "unitsub", style: "margin-left:0"}, "進行中の作業なし"));

  const evidence = (project.units || []).map(u => u.lastEvidence).filter(Boolean)
    .sort((a, b) => String(b.at || "").localeCompare(String(a.at || "")))[0];
  const ok = evidenceOk(evidence);
  card.append(el("div", {class: "evidence", style: `--c: var(--${ok === false ? "red" : ok === true ? "green" : "slate"})`},
    el("span", {}, ok === false ? "✖" : ok === true ? "✔" : "—"),
    el("span", {}, evidence ? evidence.summary : "エビデンスなし"),
    el("span", {class: "ev"}, `EV ${project.events60m || 0}`)));

  const details = el("details", {});
  details.append(el("summary", {}, "詳細"));
  details.append(el("div", {class: "micro", style: "letter-spacing:.02em;text-transform:none"}, project.path));
  for (const unit of project.units || []) {
    const state = stateOf(unit);
    if (!showDone && (state === "done" || state === "idle")) continue;
    const block = el("div", {style: "margin-top:8px", "data-unit": unit.unitId || ""});
    block.append(el("div", {class: "unitline st-" + state},
      el("span", {class: "dot"}), el("span", {class: "label"}, unit.label || unit.unitId),
      el("span", {class: "state"}, (STATE[state] || {}).label || state)));
    for (const reason of (unit.derived || {}).reasons || []) {
      block.append(el("div", {class: "unitsub", style: "color:var(--amber)"}, "▸ " + reason));
    }
    for (const m of unit.mismatches || []) {
      block.append(el("div", {class: "unitsub", style: "color:var(--red)"}, "⚠ " + m.message));
    }
    if ((unit.claims || []).length) {
      block.append(el("div", {style: "display:flex;gap:5px;flex-wrap:wrap;margin:4px 0 0 14px"},
        unit.claims.map(c => el("span", {class: "pill"}, `${c.path}${c.mode === "exclusive" ? " [排他]" : ""}`))));
    }
    const evs = (unit.recentEvents || []).slice(-8).reverse();
    if (evs.length) {
      const list = el("div", {class: "ev-list", style: "margin-left:14px"});
      for (const e of evs) {
        const cls = e.kind.startsWith("evidence.")
          ? (evidenceOk({ok: (e.data || {}).ok === undefined ? null : e.data.ok}) === false ? "red" : "") : "";
        list.append(el("div", {class: "ev-line " + cls}, agoNode(e.at, "micro"), " ", eventText(e),
          (e.data && (e.data.journeyReport || e.data.reportPath || e.data.logPath))
            ? el("div", {}, link(e.data.journeyReport || e.data.reportPath || e.data.logPath)) : null));
      }
      block.append(list);
    }
    details.append(block);
  }
  card.append(details);
  return card;
}

/* ---------- 右カラム ---------- */
function queuePanel(fleet, projectsById) {
  const items = fleet.priorityItems || [];
  const panel = document.getElementById("queuePanel");
  panel.textContent = "";
  panel.append(el("div", {class: "ph", style: "--c: var(--red)"},
    el("b", {}, "Action Queue"), el("span", {class: "micro"}, "人の手が必要な順"),
    el("span", {class: "n num"}, String(items.length).padStart(2, "0"))));
  if (!items.length) { panel.append(el("div", {class: "empty"}, "対応が必要なものはありません")); return; }
  items.slice(0, 8).forEach((item) => {
    const project = projectsById[item.projectId] || {name: item.project};
    const label = item.kind === "unit" ? (STATE[item.state] || {}).label || item.state : KIND[item.kind] || item.kind;
    // 優先度は**種類**で決まる（並び順の連番ではない）。人待ち=P0 / 障害=P1 / 様子見=P2
    const priority = item.category === "human" ? "P0" : item.category === "incident" ? "P1" : "P2";
    // 単位に紐づく項目は単位詳細へ、それ以外（衝突・資源・デバイス）はプロジェクト詳細へ
    const href = item.kind === "unit" && item.unitId
      ? unitHref({projectId: item.projectId}, {unitId: item.unitId})
      : projectHref({projectId: item.projectId});
    panel.append(el("a", {class: "rowlink", href},
      el("div", {class: "qrow cat-" + item.category},
        el("div", {class: "qtop"},
          el("span", {}, priority), el("span", {}, "·"), el("span", {}, label),
          el("span", {class: "spacer"}), agoNode(item.sinceAt, "micro")),
        el("div", {class: "qtitle"},
          el("span", {class: "sigil", style: `--pc: var(${paletteVar(project)})`}, sigilOf(project)),
          " " + (item.project || "") + " / " + item.title),
        el("div", {class: "qwhy"}, item.reason || CAT_LABEL[item.category] || ""))));
  });
  if (items.length > 8) panel.append(el("div", {class: "empty"}, `ほか ${items.length - 8} 件`));
}
function unitsPanel(fleet, projectsById) {
  const panel = document.getElementById("unitsPanel");
  panel.textContent = "";
  const rows = [];
  for (const project of fleet.projects || []) {
    for (const unit of project.units || []) {
      if (stateOf(unit) === "running") rows.push([project, unit]);
    }
  }
  panel.append(el("div", {class: "ph", style: "--c: var(--blue)"},
    el("b", {}, "Active Units"), el("span", {class: "micro"}, "稼働中の作業"),
    el("span", {class: "n num"}, String(rows.length).padStart(2, "0"))));
  if (!rows.length) { panel.append(el("div", {class: "empty"}, "実行中の作業はありません")); return; }
  for (const [project, unit] of rows.slice(0, 14)) {
    const prog = unit.progress || {};
    panel.append(el("a", {class: "rowlink", href: unitHref(project, unit)},
      el("div", {class: "urow", style: `--pc: var(${paletteVar(project)})`},
        el("span", {class: "dot pulse", style: "--c: var(--blue)"}),
        el("span", {class: "pn"}, project.displayName || project.name),
        el("span", {class: "lb"}, unit.label || unit.unitId),
        el("span", {class: "tm num"}, prog.total ? `${prog.done}/${prog.total - prog.dropped}` : ""),
        agoNode(unit.lastHeartbeat, "tm num"))));
  }
}
function drawFooter(fleet) {
  const foot = document.getElementById("footer");
  foot.textContent = "";
  const s = fleet.summary || {};
  const held = [];
  for (const project of fleet.projects || []) {
    for (const r of project.resources || []) {
      const holder = r.holder || {};
      // ツールのロック（ラッパーが記録したもの）は申告と区別する。
      // 「効くほう」と「見えるほう」が同じ欄に並ぶので、どちらの由来かが分からないと追えない
      const via = r.source === "tool" ? "（ツール）" : "";
      held.push(`${r.resource} → ${holder.label || holder.unitId || "?"}${via}`);
    }
  }
  foot.append(el("span", {class: "k"}, "Exclusive Resources"),
    el("span", {class: "v"}, held.length ? held.slice(0, 3).join("　/　") : "なし"));
  const devices = (fleet.projects || []).flatMap(p => p.devices || []);
  foot.append(el("span", {class: "k"}, "Device Load"),
    el("span", {class: "v"}, devices.length
      ? devices.map(d => `${d.serial} ${d.load1 ?? "?"}`).join("　/　") : "接続なし"));
  foot.append(el("span", {class: "spacer"}));
  if (s.conflicts) foot.append(el("span", {class: "badge-conf"}, `⚔ 編集衝突 ${s.conflicts} 件`));
  foot.append(el("span", {class: "k"}, "Fleet"), el("span", {class: "v"}, `${s.units || 0} units`));
}

/* 更新の生死。緑が点滅しているだけでは、配信が落ちても気付けない */
function drawFeed(fleet) {
  const feed = document.getElementById("feed");
  feed.textContent = "";
  if (!location.protocol.startsWith("http")) {
    feed.className = "feed snap";
    feed.append("スナップショット ", agoNode(fleet.generatedAt, ""), "前");
    return;
  }
  const age = secondsSince(lastFetchAt || fleet.generatedAt);
  const level = age <= 10 ? "ok" : age <= 30 ? "late" : "dead";
  feed.className = "feed " + level;
  feed.append(el("span", {class: "dot" + (level === "ok" ? " pulse" : ""),
                          style: `--c: var(--${level === "ok" ? "green" : level === "late" ? "amber" : "red"})`}),
    level === "ok" ? "LIVE " : level === "late" ? "遅延 " : "停止 ", agoNode(lastFetchAt || fleet.generatedAt, ""));
}

function tickAges() {
  for (const node of document.querySelectorAll("[data-at]")) node.textContent = ago(node.getAttribute("data-at"));
  const now = new Date();
  document.getElementById("clock").textContent =
    [now.getHours(), now.getMinutes(), now.getSeconds()].map(n => String(n).padStart(2, "0")).join(":");
  if (current) drawFeed(current);
}

/* ---------- 2 段目: プロジェクト詳細 / 単位詳細 ----------
   ルーティングは location.hash だけで完結させる（--out の 1 ファイル出力でも遷移が効く）。
   判定・並び順は集約側の値をそのまま使い、ここでは数え直さない */
function route() {
  // 壊れた hash（`#/p/%` 等）で decodeURIComponent が例外を投げると描画ごと止まる。
  // URL は共有されるので、不正な値はフリート表示へ落として画面を殺さない
  const decode = (s) => { try { return decodeURIComponent(s); } catch (e) { return null; } };
  const parts = (location.hash || "").replace(/^#\/?/, "").split("/").filter(Boolean);
  if (parts[0] === "p" && parts[1]) {
    const projectId = decode(parts[1]);
    return projectId ? {view: "project", projectId} : {view: "fleet"};
  }
  if (parts[0] === "u" && parts[1] && parts[2]) {
    const projectId = decode(parts[1]), unitId = decode(parts[2]);
    return (projectId && unitId) ? {view: "unit", projectId, unitId} : {view: "fleet"};
  }
  return {view: "fleet"};
}
function projectHref(project) { return "#/p/" + encodeURIComponent(project.projectId || ""); }
function unitHref(project, unit) {
  return "#/u/" + encodeURIComponent(project.projectId || "") + "/" + encodeURIComponent(unit.unitId || "");
}
function crumbs(...items) {
  const box = el("div", {class: "crumbs"});
  items.forEach((item, i) => {
    if (i) box.append(el("span", {}, "›"));
    box.append(item.href ? el("a", {href: item.href}, item.text) : el("span", {}, item.text));
  });
  return box;
}
function stateChip(unit) {
  const state = stateOf(unit);
  return el("span", {class: "unitline st-" + state, style: "display:inline-flex"},
    el("span", {class: "dot" + (state === "running" ? " pulse" : "")}),
    el("span", {class: "state"}, (STATE[state] || {}).label || state));
}
function laneRows(events, producer) {
  const rows = events.filter(e => (e.producer || "") === producer);
  if (!rows.length) return [el("div", {class: "empty"}, producer === "agent" ? "申告なし" : "実測なし")];
  return rows.map(e => {
    const red = e.kind.startsWith("evidence.") && (e.data || {}).ok === false;
    const line = el("div", {class: "ln" + (red ? " red" : "")},
      el("span", {class: "t"}, hhmm(e.at)), el("span", {}, eventText(e)));
    const target = (e.data || {}).journeyReport || (e.data || {}).reportPath
                || (e.data || {}).failureDir || (e.data || {}).logPath || (e.data || {}).xmlPath;
    if (target) line.append(el("span", {}), el("span", {}, link(target)));
    return line;
  });
}
function drawUnitDetail(fleet, project, unit) {
  const box = document.getElementById("detailView");
  const derived = unit.derived || {};
  const prog = unit.progress || {};
  box.append(crumbs({text: "Fleet", href: "#/"},
                    {text: project.displayName || project.name, href: projectHref(project)},
                    {text: unit.label || unit.unitId}));
  box.append(el("div", {class: "dhead"}, el("h2", {}, unit.label || unit.unitId), stateChip(unit),
    el("span", {class: "path"}, unit.unitId)));

  const grid = el("div", {class: "dgrid"});
  const info = el("div", {class: "dpanel"}, el("h3", {}, "概要"));
  const kv = el("div", {class: "kv"});
  const rows = [
    ["担当", `${(unit.owner || {}).agent || "不明"}${(unit.owner || {}).host ? " @ " + unit.owner.host : ""}`],
    ["開始", unit.startedAt || "—"],
    ["最終更新", unit.lastHeartbeat || "—"],
    ["終了", unit.endedAt ? `${unit.endedAt}（${unit.result || ""}）` : "—"],
    ["いま", unit.activity || "—"],
    ["進捗", prog.total ? `${prog.done}/${prog.total - (prog.dropped || 0)}` : "—"],
  ];
  if (derived.acknowledged) rows.push(["確認済み", unit.acknowledgedAt + (unit.acknowledgedNote ? "（" + unit.acknowledgedNote + "）" : "")]);
  for (const [k, v] of rows) { kv.append(el("span", {class: "k"}, k), el("span", {}, v)); }
  info.append(kv);
  for (const reason of derived.reasons || []) info.append(el("div", {class: "unitsub", style: "color:var(--amber);margin-left:0"}, "▸ " + reason));
  for (const m of unit.mismatches || []) info.append(el("div", {class: "unitsub", style: "color:var(--red);margin-left:0"}, "⚠ " + m.message));
  grid.append(info);

  if ((unit.tasks || []).length) {
    const panel = el("div", {class: "dpanel"}, el("h3", {}, "タスク"));
    const list = el("div", {class: "tasklist"});
    for (const task of unit.tasks) {
      list.append(el("div", {class: "tk " + (task.status || "")},
        el("span", {}, task.status === "done" ? "✔" : task.status === "dropped" ? "⊘" : "·"),
        el("span", {}, task.title || task.id),
        task.note ? el("span", {class: "micro"}, task.note) : null));
    }
    panel.append(list);
    grid.append(panel);
  }

  if ((unit.claims || []).length || (unit.resources || []).length) {
    const panel = el("div", {class: "dpanel"}, el("h3", {}, "宣言した領域と排他資源"));
    if ((unit.claims || []).length) {
      panel.append(el("div", {style: "display:flex;gap:5px;flex-wrap:wrap"},
        unit.claims.map(c => el("span", {class: "pill"}, `${c.path}${c.mode === "exclusive" ? " [排他]" : ""}`))));
    }
    for (const r of unit.resources || []) panel.append(el("div", {class: "unitsub", style: "margin-left:0"}, "🔒 " + r));
    grid.append(panel);
  }

  // 終了済みの失敗・中断は「確認した」と記録するまで要注意欄に残る。外し方をここに置く
  // （静的 HTML から状態は書き換えられないので、打つべきコマンドを示す）
  if (derived.terminal && derived.attentionCategory && !derived.acknowledged) {
    grid.append(el("div", {class: "dpanel"}, el("h3", {}, "確認済みにする"),
      el("div", {class: "unitsub", style: "margin-left:0"}, "対応が済んだら要注意欄から外せる"),
      el("div", {class: "cmd"}, `uapp-dash --project ${project.path} ack --unit-id ${unit.unitId} --note "確認した内容"`)));
  }
  box.append(grid);

  const events = (unit.recentEvents || []).slice().sort((a, b) => String(a.at || "").localeCompare(String(b.at || "")));
  const total = unit.eventTotal || events.length;
  const lanes = el("div", {class: "lanes", style: "margin-top:12px"});
  lanes.append(el("div", {class: "dpanel lane"}, el("h3", {}, "申告（エージェント）"), laneRows(events, "agent")));
  lanes.append(el("div", {class: "dpanel lane"}, el("h3", {}, "客観エビデンス（ツール）"), laneRows(events, "tool")));
  box.append(lanes);
  // 表示件数を隠さない（全部出ていると思わせない）。失敗と終了申告は件数に関わらず残す設計
  if (total > events.length) {
    box.append(el("div", {class: "unitsub", style: "margin:8px 0 0"},
      `表示は直近 ${events.length} 件（全 ${total} 件）。失敗したエビデンスと終了申告は件数に関わらず残す`));
  }
}
function drawProjectDetail(fleet, project) {
  const box = document.getElementById("detailView");
  box.append(crumbs({text: "Fleet", href: "#/"}, {text: project.displayName || project.name}));
  box.append(el("div", {class: "dhead"},
    el("span", {class: "sigil", style: `--pc: var(${paletteVar(project)})`}, sigilOf(project)),
    el("h2", {}, project.displayName || project.name),
    el("span", {class: "path"}, project.path),
    sparkline(project.activityBuckets, project.runningCount ? "var(--blue)" : "var(--slate)")));

  const grid = el("div", {class: "dgrid"});
  const units = el("div", {class: "dpanel"}, el("h3", {}, `作業単位（${(project.units || []).length}）`));
  for (const unit of project.units || []) {
    const state = stateOf(unit);
    const prog = unit.progress || {};
    units.append(el("a", {class: "rowlink", href: unitHref(project, unit)},
      el("div", {class: "unitline clickable st-" + state},
        el("span", {class: "dot" + (state === "running" ? " pulse" : "")}),
        el("span", {class: "label"}, unit.label || unit.unitId),
        el("span", {class: "state"}, (STATE[state] || {}).label || state)),
      el("div", {class: "unitsub"},
        el("span", {}, unit.activity || ((unit.derived || {}).reasons || [])[0] || ""),
        el("span", {}, "·"), agoNode(unit.lastHeartbeat),
        prog.total ? el("span", {}, `· ${prog.done}/${prog.total - (prog.dropped || 0)}`) : null)));
  }
  if (!(project.units || []).length) units.append(el("div", {class: "empty"}, "記録された作業単位はありません"));
  grid.append(units);

  if ((project.priorityItems || []).length) {
    const panel = el("div", {class: "dpanel"}, el("h3", {}, "要注意"));
    for (const item of project.priorityItems) {
      panel.append(el("div", {class: "unitsub", style: "margin-left:0"},
        el("span", {}, (item.category === "human" ? "P0" : item.category === "incident" ? "P1" : "P2") + " " + item.title),
        el("span", {}, "·"), el("span", {}, item.reason || "")));
    }
    grid.append(panel);
  }
  if ((project.resources || []).length) {
    const panel = el("div", {class: "dpanel"}, el("h3", {}, "排他資源"));
    for (const r of project.resources) {
      const holder = r.holder || {};
      panel.append(el("div", {class: "unitsub", style: "margin-left:0"},
        el("span", {}, r.resource), el("span", {}, "→"),
        el("span", {}, holder.label || holder.unitId || "?"),
        r.source === "tool" ? el("span", {}, "（ツール）") : null,
        r.holderAlive === false ? el("span", {style: "color:var(--red)"}, "保持者不在") : null));
    }
    grid.append(panel);
  }
  if ((project.devices || []).length) {
    const panel = el("div", {class: "dpanel"}, el("h3", {}, "デバイス"));
    for (const d of project.devices) {
      panel.append(el("div", {class: "unitsub", style: "margin-left:0"},
        el("span", {}, d.serial), el("span", {}, `load ${d.load1}`),
        (d.ports || []).length ? el("span", {}, "ports " + d.ports.join(",")) : null,
        d.warn ? el("span", {style: "color:var(--amber)"}, "過負荷") : null));
    }
    grid.append(panel);
  }
  if ((project.warnings || []).length) {
    const panel = el("div", {class: "dpanel"}, el("h3", {}, "記録の警告"));
    for (const w of project.warnings) panel.append(el("div", {class: "unitsub", style: "margin-left:0;color:var(--amber)"}, w));
    grid.append(panel);
  }
  box.append(grid);
}
function drawDetail(fleet, target) {
  const box = document.getElementById("detailView");
  box.textContent = "";
  const project = (fleet.projects || []).find(p => p.projectId === target.projectId);
  if (!project) {
    box.append(crumbs({text: "Fleet", href: "#/"}), el("div", {class: "empty"}, "このプロジェクトは記録に無い（削除されたか、別のホストの記録）"));
    return;
  }
  if (target.view === "unit") {
    const unit = (project.units || []).find(u => u.unitId === target.unitId);
    if (!unit) {
      box.append(crumbs({text: "Fleet", href: "#/"}, {text: project.displayName || project.name, href: projectHref(project)}),
        el("div", {class: "empty"}, "この作業単位は記録に無い（完了分の保持上限を超えた可能性）"));
      return;
    }
    drawUnitDetail(fleet, project, unit);
    return;
  }
  drawProjectDetail(fleet, project);
}

function draw(fleet) {
  if (!fleet) return;
  const target = route();
  const fleetView = document.getElementById("fleetView");
  const detailView = document.getElementById("detailView");
  document.getElementById("host").textContent = (fleet.host || "") + " · local fleet";
  drawStats(fleet);
  drawFeed(fleet);
  if (target.view !== "fleet") {
    fleetView.hidden = true;
    detailView.hidden = false;
    drawDetail(fleet, target);
    tickAges();
    return;
  }
  fleetView.hidden = false;
  detailView.hidden = true;
  drawFleet(fleet);
}

function drawFleet(fleet) {
  const open = new Set(Array.from(document.querySelectorAll("details[open]"))
    .map(d => (d.closest("[data-project]") || {}).dataset?.project).filter(Boolean));
  const showDone = document.getElementById("showDone").checked;
  const projects = fleet.projects || [];
  const projectsById = {};
  for (const p of projects) projectsById[p.projectId] = p;

  // 一列サマリ: 全プロジェクトを 1 行で。稼働＝青、要注意＝赤/黄、待機＝灰
  const strip = document.getElementById("fleetStrip");
  strip.textContent = "";
  for (const project of projects) {
    const worst = (project.priorityItems || [])[0];
    const color = worst ? (worst.category === "watch" ? "amber" : "red")
                        : (project.runningCount ? "blue" : "slate");
    strip.append(el("a", {class: "rowlink", href: projectHref(project), style: "display:inline-block"},
      el("span", {class: "fchip", style: `--c: var(--${color}); --pc: var(${paletteVar(project)})`,
                             title: `${project.displayName || project.name}: 稼働 ${project.runningCount || 0} / 要注意 ${project.attentionCount || 0}`},
        el("span", {class: "dot" + (project.runningCount ? " pulse" : "")}),
        el("span", {class: "pn"}, project.displayName || project.name),
        el("span", {class: "n"}, `${project.runningCount || 0}▶`),
        (project.attentionCount ? el("span", {class: "n"}, `${project.attentionCount}!`) : null))));
  }

  const matrix = document.getElementById("matrix");
  matrix.textContent = "";
  document.getElementById("matrixCount").textContent = `${projects.length} projects`;
  if (!projects.length) {
    matrix.append(el("div", {class: "empty"}, "登録されたプロジェクトが無い。対象で uapp-dash init を実行する"));
  } else {
    projects.forEach((p, i) => matrix.append(projectCard(p, i, showDone)));
  }
  queuePanel(fleet, projectsById);
  unitsPanel(fleet, projectsById);
  drawFooter(fleet);

  for (const card of matrix.querySelectorAll("[data-project]")) {
    if (open.has(card.dataset.project)) { const d = card.querySelector("details"); if (d) d.open = true; }
  }
  tickAges();
}

let current = FLEET;
let lastFetchAt = FLEET ? FLEET.generatedAt : null;
const showDone = document.getElementById("showDone");
const tvMode = document.getElementById("tvMode");
const theme = document.getElementById("theme");
function applyTheme() {
  if (theme.value === "auto") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme", theme.value);
}
function save() {
  try {
    localStorage.setItem("dash.showDone", showDone.checked ? "1" : "");
    localStorage.setItem("dash.tv", tvMode.checked ? "1" : "");
    localStorage.setItem("dash.theme", theme.value);
  } catch (e) { /* 保存できなくても表示は変わらない */ }
}
showDone.addEventListener("change", () => { save(); draw(current); });
tvMode.addEventListener("change", () => { document.body.classList.toggle("tv", tvMode.checked); save(); draw(current); });
theme.addEventListener("change", () => { applyTheme(); save(); });
try {
  showDone.checked = localStorage.getItem("dash.showDone") === "1";
  tvMode.checked = localStorage.getItem("dash.tv") === "1";
  // 既定はダーク（管制画面として見る前提。OS 追従が良ければ選択できる）
  theme.value = localStorage.getItem("dash.theme") || "dark";
  document.body.classList.toggle("tv", tvMode.checked);
} catch (e) { /* 参照できない環境では既定のまま */ }
applyTheme();
// 戻る/進む・URL 直打ち・リンクのどれでも同じ経路で描き直す（ビューの状態は hash だけが持つ）
window.addEventListener("hashchange", () => { window.scrollTo(0, 0); draw(current); });
draw(current);
setInterval(tickAges, 1000);
if (location.protocol.startsWith("http")) {
  setInterval(async () => {
    try {
      const res = await fetch("fleet.json", {cache: "no-store"});
      if (res.ok) { current = await res.json(); lastFetchAt = new Date().toISOString(); draw(current); }
    } catch (e) { /* 取得できない状態は「停止」として表示に出る */ }
  }, 5000);
}
</script>
